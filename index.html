<!doctype html>
<html lang="id">
<head>

<title>OTN 8 2026 E-Sport Mobile Legends</title>
<style>
:root{--bg:#0f1220;--fg:#f2f4fa;--mut:#9aa3bd;--ac:#f5b83d}
@media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--fg:#161a2b;--mut:#5b6482;--ac:#b97a00}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{max-width:520px;text-align:center}
.tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac);border-radius:999px;padding:4px 12px;margin-bottom:20px}
h1{font-size:clamp(26px,6vw,36px);line-height:1.2;margin:0 0 12px}
p{color:var(--mut);line-height:1.6;margin:0}
</style>
</head>
<body>
<main>
<span class="tag">OTN 8 2026</span>
<h1>Situs ditutup sementara</h1>
<p>Halaman informasi lomba E-Sport Mobile Legends sedang diperbarui oleh panitia. Pengumuman resmi akan dibagikan melalui grup WhatsApp dan kontak panitia.</p>
</main>
</body>
</html>
